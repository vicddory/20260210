<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tool Atlas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #08080d;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #252535;
  --text: #e8e8f0;
  --text-dim: #7878a0;
  --accent: #7c6aef;
  --accent-glow: #7c6aef40;
  --accent2: #22d3b8;
  --accent3: #f472b6;
  --hover: #1e1e2e;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Outfit', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

body::after {
  content:'';
  position:fixed; inset:0;
  background: radial-gradient(ellipse 60% 40% at 50% 0%, #7c6aef08 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

.header {
  padding: 52px 40px 36px;
  text-align: center;
  position: relative;
  z-index:1;
}

.header h1 {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, #fff 0%, #7c6aef 60%, #22d3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
}

.header p {
  color: var(--text-dim);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: -0.2px;
}

.header .stats {
  margin-top: 14px;
  display: flex;
  gap: 24px;
  justify-content: center;
  font-size: 13px;
  color: var(--text-dim);
}

.header .stats span {
  color: var(--accent2);
  font-weight: 600;
}

.cat-wrap {
  padding: 24px 20px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
}

.cat-wrap::after {
  content:'';
  position:absolute;
  bottom:-24px; left:0; right:0;
  height:24px;
  background: linear-gradient(var(--bg), transparent);
  pointer-events:none;
}

.cats {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 18px;
  scrollbar-width: none;
  justify-content: center;
  flex-wrap: wrap;
}
.cats::-webkit-scrollbar { display:none; }

.cat-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: var(--surface);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
}

.cat-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.cat-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 24px var(--accent-glow);
  font-weight: 600;
}

.cat-btn .cnt {
  background: #ffffff12;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
}
.cat-btn.active .cnt { background: #ffffff28; }

.main {
  max-width: 1260px;
  margin: 0 auto;
  padding: 24px 24px 80px;
  position: relative;
  z-index: 1;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}

.grid.appear {
  animation: fadeUp 0.35s ease;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(14px); }
  to { opacity:1; transform:translateY(0); }
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  text-align: left;
  width: 100%;
  color: var(--text);
}

.tool-btn:hover {
  border-color: var(--accent);
  background: var(--hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px #00000050;
}

.t-logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  border: 1px solid var(--border);
}

.t-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 4px;
}

.t-logo .fb {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
}

.t-info h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}

.t-info .sub {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
}

/* Overlay + Panel */
.ov {
  position:fixed; inset:0;
  background: #000000a0;
  backdrop-filter: blur(6px);
  z-index: 1000;
  opacity:0; pointer-events:none;
  transition: opacity 0.3s;
}
.ov.show { opacity:1; pointer-events:all; }

.panel {
  position:fixed; top:0; right:0;
  width: min(580px, 100vw);
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 1001;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.panel.show { transform: translateX(0); }

.p-head {
  padding: 24px 24px 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: sticky; top:0;
  background: var(--surface);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.p-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.p-logo {
  width: 50px; height: 50px;
  border-radius: 14px;
  background: var(--surface2);
  display:flex; align-items:center; justify-content:center;
  border: 1px solid var(--border);
  overflow: hidden;
  flex-shrink:0;
}

.p-logo img {
  width:100%; height:100%;
  object-fit: contain;
  padding: 4px;
}

.p-logo .fb {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}

.p-title h2 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.p-title .id-tag {
  font-size: 13px;
  color: var(--accent2);
  font-weight: 500;
  margin-top: 1px;
}

.p-acts {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 12px;
}

.visit {
  display:flex; align-items:center; gap:5px;
  padding: 9px 16px;
  background: var(--accent);
  color: #fff;
  border:none; border-radius:10px;
  font-size: 13px; font-weight: 600;
  cursor:pointer; transition: all 0.2s;
  font-family: inherit;
  text-decoration: none;
  white-space: nowrap;
}
.visit:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--accent-glow);
}

.close {
  width:36px; height:36px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface2);
  color: var(--text-dim);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size: 16px;
  transition: all 0.2s;
  font-family: inherit;
}
.close:hover { background: var(--border); color: var(--text); }

.p-body {
  padding: 22px 24px 48px;
}

.sec {
  margin-bottom: 22px;
}

.sec .lbl {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.sec .lbl .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.sec .val {
  font-size: 14.5px;
  line-height: 1.75;
  color: #c0c0d4;
  padding: 14px 16px;
  background: var(--surface2);
  border-radius: 12px;
  border: 1px solid var(--border);
  word-break: keep-all;
  white-space: pre-wrap;
}

.tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tag {
  padding: 6px 14px;
  background: #ffffff06;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
}

.tag.price {
  border-color: var(--accent2);
  color: var(--accent2);
  background: #22d3b808;
}

.tag.prompt {
  border-color: var(--accent3);
  color: var(--accent3);
  background: #f472b608;
}

.empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-dim);
}

.empty .ic { font-size: 48px; margin-bottom: 14px; opacity: 0.4; }

@media (max-width: 640px) {
  .header { padding: 28px 16px 24px; }
  .header h1 { font-size: 30px; }
  .cat-wrap { padding: 14px 10px 0; }
  .cats { justify-content: flex-start; flex-wrap: nowrap; }
  .main { padding: 16px 10px 40px; }
  .grid { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .p-head { padding: 18px 14px 14px; }
  .p-body { padding: 16px 14px 32px; }
  .p-acts { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>AI Tool Atlas</h1>
  <p>분야별 AI 도구를 탐색하고, 각 도구의 특징을 한눈에 확인하세요</p>

    <div><span id="totalTools">0</span> 개 도구</div>
    <div><span id="totalCats">0</span> 개 분야</div>
  </div>
</div>

<div class="cat-wrap">
  <div class="cats" id="cats"></div>
</div>

<div class="main">
  <div class="grid" id="grid"></div>
</div>

<div class="ov" id="ov"></div>
<div class="panel" id="panel">
  <div class="p-head">
    <div class="p-left">
      <div class="p-logo" id="pLogo"></div>
      <div class="p-title">

        <div class="id-tag" id="pId"></div>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        바로가기
      </a>
      <button class="close" id="closeBtn">✕</button>
    </div>
  </div>
  <div class="p-body" id="pBody"></div>
</div>

const catIcons={"글쓰기·정리": "✍️", "대학생활": "🎓", "로컬 AI": "🖥️", "만화·스토리보드": "🎨", "모델 & 추론": "🧠", "바이브 코딩": "💻", "번역 & 검색": "🔍", "시각화 / PPT": "📊", "아바타 & 비디오": "🎭", "영상 생성·편집": "🎬", "웹 / UI / UX": "🌐", "유틸리티": "🔧", "음성 합성": "🎙️", "음악 생성": "🎵", "이미지 생성": "🖼️", "이미지 편집": "✂️", "자동화·AI 에이전트": "🤖", "캐릭터 챗봇": "💬", "회의·기록": "📝"};

const cats=[...new Set(D.map(d=>d.c))].sort();
let cur=cats[0];

document.getElementById('totalTools').textContent=D.length;
document.getElementById('totalCats').textContent=cats.length;

function logoUrl(id){
  const t=D.find(d=>d.id===id);
  if(t&&t.u&&t.u!=='#'){
    try{
      const domain=new URL(t.u).hostname;
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    }catch(e){}
  }
  return '';
}

function logoFallback(name){
  return name.charAt(0).toUpperCase();
}

function renderCats(){
  const el=document.getElementById('cats');
  el.innerHTML=cats.map(c=>{
    const count=D.filter(d=>d.c===c).length;
    const icon=catIcons[c]||'📌';
    return `<button class="cat-btn${c===cur?' active':''}" data-c="${c}">${icon} ${c} <span class="cnt">${count}</span></button>`;
  }).join('');
  el.querySelectorAll('.cat-btn').forEach(b=>{
    b.onclick=()=>{
      cur=b.dataset.c;
      renderCats();
      renderGrid();
    };
  });
}

function renderGrid(){
  const el=document.getElementById('grid');
  const tools=D.filter(d=>d.c===cur);
  el.className='grid appear';
  el.innerHTML=tools.map((t,i)=>{
    const imgSrc=logoUrl(t.id);
    return `<button class="tool-btn" data-idx="${D.indexOf(t)}" style="animation-delay:${i*30}ms">
      <div class="t-logo">
        <img src="${imgSrc}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="">
        <span class="fb" style="display:none">${logoFallback(t.n)}</span>
      </div>
      <div class="t-info">
        <h3>${t.n}</h3>
        ${t.i?`<div class="sub">${t.i}</div>`:''}
      </div>
    </button>`;
  }).join('');
  el.querySelectorAll('.tool-btn').forEach(b=>{
    b.onclick=()=>openDetail(parseInt(b.dataset.idx));
  });
}

function openDetail(idx){
  const t=D[idx];
  const imgSrc=logoUrl(t.id);

  document.getElementById('pLogo').innerHTML=
    `<img src="${imgSrc}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="">
     <span class="fb" style="display:none">${logoFallback(t.n)}</span>`;
  document.getElementById('pName').textContent=t.n;
  document.getElementById('pId').textContent=t.i||t.c;
  document.getElementById('visitBtn').href=t.u||'#';

  let html='';

  if(t.s){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#22d3b8"></span>강점</div>
      <div class="val">${t.s}</div>
    </div>`;
  }

  if(t.w){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#f472b6"></span>약점</div>
      <div class="val">${t.w}</div>
    </div>`;
  }

  if(t.r){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#fbbf24"></span>추천 상황</div>
      <div class="val">${t.r}</div>
    </div>`;
  }

  html+='<div class="sec"><div class="lbl">💰 가격 & 프롬프트</div><div class="tags">';
  if(t.p) html+=`<span class="tag price">${t.p}</span>`;
  if(t.pf) html+=`<span class="tag prompt">${t.pf}</span>`;
  html+='</div></div>';

  if(t.pl){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#7c6aef"></span>요금제 특징</div>
      <div class="val">${t.pl}</div>
    </div>`;
  }

  if(t.pe){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#60a5fa"></span>실전 프롬프트 예시</div>
      <div class="val" style="font-size:13.5px;font-style:italic;color:#a0a0c0">${t.pe}</div>
    </div>`;
  }

  if(t.pf && t.pf.length > 5){
    html+=`<div class="sec">
      <div class="lbl"><span class="dot" style="background:#f472b6"></span>프롬프트 특징</div>
      <div class="val">${t.pf}</div>
    </div>`;
  }

  document.getElementById('pBody').innerHTML=html;
  document.getElementById('ov').classList.add('show');
  document.getElementById('panel').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('ov').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
  document.body.style.overflow='';
}

document.getElementById('ov').onclick=closeDetail;
document.getElementById('closeBtn').onclick=closeDetail;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

renderCats();
renderGrid();
</script>
</body>
</html>
